<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أغنية</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      text-align: center;
    }

    button {
      padding: 14px 28px;
      border: 0;
      border-radius: 8px;
      background: #e62117;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #message {
      display: none;
      font-size: 22px;
      margin-top: 25px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>🎵 اضغط لتشغيل الأغنية</h2>
    <button onclick="showMessage()">تشغيل</button>

    <div id="message">تم نسخ معلوماتك بنجاح</div>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").style.display = "block";
    }
  </script>

</body>
</html>
